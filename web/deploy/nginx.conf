# venleylabs.com on the Raspberry Pi, behind the Cloudflare Tunnel (which sends it to port 3001).
# deploy.sh installs it as /etc/nginx/sites-available/venleylabs and reloads nginx when it changes.

map $uri $venleylabs_cache {
    ~^/_next/static/  "public, max-age=31536000, immutable";
    default           "";
}

server {
    listen 127.0.0.1:3001;
    root /opt/venleylabs-web/current;
    index index.html;
    server_tokens off;
    # Keep redirects like /pt/formacao → /pt/formacao/ relative, not http://127.0.0.1:3001/….
    absolute_redirect off;

    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $venleylabs_cache always;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
